services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assessment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assessment"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/assessment
      MQTT_CERTIFICATE: /certs/emqxsl-ca.crt
    volumes:
      - ./cert/emqxsl-ca.crt:/certs/emqxsl-ca.crt:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
